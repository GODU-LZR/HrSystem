# Spring Boot应用的端口
server.port=8081

# MyBatis配置
# 指定Mybatis的Mapper文件位置
mybatis.mapper-locations=classpath:mapper/*.xml
# 指定Mybatis的实体类所在包
mybatis.type-aliases-package=com.example.test.demos.pojo

# 数据源配置（用于Session存储）
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/SystemAdministrationModule?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=1253846077a
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

# 配置Spring Session，使用JDBC存储Session
spring.session.store-type=jdbc
# 是否初始化Session表，never表示不自动创建
spring.session.jdbc.initialize-schema=always

# Session的超时时间配置（单位为秒），可以根据需求调整
server.servlet.session.timeout=1800

# 配置 Session Cookie 属性
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# 允许跨站点发送 Cookie

# 必须使用 HTTPS 才能设置为 Secure


# Spring Boot日志配置
logging.file.name=./log/monitor.log
logging.pattern.file="%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

# Swagger配置（解决与actuator的冲突问题）
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
management.endpoints.web.exposure.include=*

# 配置 Spring Boot 映射上传目录为静态资源
spring.web.resources.static-locations=classpath:/static/,file:uploads/



