<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统管理模块登录</title>
    <style>
        /* 全局样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 主容器 */
        .login-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            padding: 30px;
            text-align: center;
        }

        .login-container h1 {
            font-size: 24px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        /* 输入框样式 */
        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        /* 登录按钮样式 */
        .login-container button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-container .login-btn {
            background-color: #4CAF50;
            color: white;
            margin-top: 10px;
        }

        .login-container .login-btn:hover {
            background-color: #388E3C;
        }

        /* 注册按钮样式 */
        .login-container .register-btn {
            background-color: #4CAF50;
            color: white;
            margin-top: 10px;
        }

        .login-container .register-btn:hover {
            background-color: #388E3C;
        }

        /* 底部文字 */
        .login-container .footer-text {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .login-container .footer-text a {
            color: #4CAF50;
            text-decoration: none;
        }

        .login-container .footer-text a:hover {
            text-decoration: underline;
        }

        /* 响应式适配 */
        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 20px;
            }

            .login-container h1 {
                font-size: 20px;
            }

            .login-container input[type="text"],
            .login-container input[type="password"] {
                font-size: 14px;
            }

            .login-container button {
                font-size: 16px;
            }
        }
    </style>
</head>
<script>
    async function loginUser() {
        // 获取输入框的值
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        // 校验输入框是否为空
        if (!username || !password) {
            alert("用户名或密码不能为空！");
            return;
        }

        try {
            // 向后端发送登录请求
            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });

            // 解析返回结果
            const result = await response.text();

            if (response.ok) {
                // 登录成功提示并跳转页面
                alert(result);
                window.location.href = "/private/system-admin.html";
            } else {
                // 登录失败提示
                alert(result);
            }
        } catch (error) {
            console.error("登录失败:", error);
            alert("登录失败，请稍后重试！");
        }
    }
</script>
</head>
<body>
    <div class="login-container">
        <h1>系统管理模块登录</h1>
        <input type="text" id="username" placeholder="请输入用户名" required />
        <input type="password" id="password" placeholder="请输入密码" required />
        <button type="button" class="login-btn" onclick="loginUser()">登录</button>
        <button type="button" class="register-btn" onclick="window.location.href='/public/register.html'">注册</button>
        <p class="footer-text">
            忘记密码？<a href="/reset-password">点击这里重置</a>
        </p>
    </div>
</body>
</html>
