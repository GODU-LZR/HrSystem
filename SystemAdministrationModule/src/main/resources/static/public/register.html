<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <style>
        /* 全局样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 注册容器 */
        .register-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            padding: 30px;
            text-align: center;
        }

        .register-container h1 {
            font-size: 24px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        /* 输入框样式 */
        .register-container input[type="text"],
        .register-container input[type="password"],
        .register-container input[type="email"],
        .register-container select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        /* 注册按钮样式 */
        .register-container button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .register-container button:hover {
            background-color: #388E3C;
        }

        /* 底部链接 */
        .register-container .footer-text {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .register-container .footer-text a {
            color: #4CAF50;
            text-decoration: none;
        }

        .register-container .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<script>
    async function registerUser() {
        // 获取输入框的值
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm_password").value;
        const email = document.getElementById("email").value;

        // 校验字段是否为空
        if (!username || !password || !confirmPassword || !email) {
            alert("所有字段均为必填项！");
            return;
        }

        // 校验密码一致性
        if (password !== confirmPassword) {
            alert("两次输入的密码不一致！");
            return;
        }

        try {
            // 向后端发送注册请求
            const response = await fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password, email })
            });

            // 解析返回结果
            const result = await response.text();

            if (response.ok) {
                // 注册成功提示并跳转到登录页面
                alert(result);
                window.location.href = "/public/login.html";
            } else {
                // 注册失败提示
                alert(result);
            }
        } catch (error) {
            console.error("注册失败:", error);
            alert("注册失败，请稍后重试！");
        }
    }
</script>
</head>
<body>
    <div class="register-container">
        <h1>用户注册</h1>
        <input type="text" id="username" placeholder="请输入用户名" required />
        <input type="password" id="password" placeholder="请输入密码" required />
        <input type="password" id="confirm_password" placeholder="请再次输入密码" required />
        <input type="email" id="email" placeholder="请输入邮箱" required />
        <button type="button" onclick="registerUser()">注册</button>
        <p class="footer-text">
            已有账户？<a href="/public/login.html">立即登录</a>
        </p>
    </div>
    
</body>
</html>
